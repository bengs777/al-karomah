<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Login Admin - Masjid Al Karomah</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #10b981, #059669);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background: white;
      border-radius: 1.5rem;
      padding: 3rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    }
    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo span { font-size: 3rem; }
    .login-logo h1 { font-size: 1.5rem; margin-top: 0.5rem; color: #1f2937; }
    .login-logo p { color: #6b7280; font-size: 0.875rem; margin-top: 0.25rem; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #1f2937;
      font-size: 0.875rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1px solid #e5e7eb;
      border-radius: 0.75rem;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16,185,129,0.1);
    }
    .btn {
      display: block;
      width: 100%;
      padding: 1rem;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #059669; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg {
      background: #fee2e2;
      color: #991b1b;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      display: none;
    }
    .info-msg {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #6b7280;
    }
    .info-msg a { color: #10b981; text-decoration: none; font-weight: 600; }
    .info-msg a:hover { text-decoration: underline; }
    .form-hint { font-size: 0.75rem; color: #9ca3af; margin-top: 0.375rem; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-logo">
      <span>🕌</span>
      <h1>Masjid Al Karomah</h1>
      <p>Panel Administrasi</p>
    </div>

    <div id="error-msg" class="error-msg"></div>

    <form id="login-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Masukkan username" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Masukkan password" required>
      </div>
      <button type="submit" class="btn" id="login-btn">Masuk ke Admin</button>
    </form>

    <div class="info-msg">
      <a href="/">← Kembali ke Beranda</a>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errorEl = document.getElementById('error-msg');
      btn.disabled = true;
      btn.textContent = 'Memproses...';

      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();

        if (data.status === 'success') {
          window.location.href = data.redirect || '/admin';
        } else {
          errorEl.textContent = data.message || 'Login gagal';
          errorEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Masuk ke Admin';
        }
      } catch (err) {
        errorEl.textContent = 'Terjadi kesalahan. Coba lagi.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Masuk ke Admin';
      }
    });
  </script>
</body>
</html>
