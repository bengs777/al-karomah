<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Galeri - Admin</title>
    <link rel="stylesheet" href="/admin/assets/css/admin.css">

</head>
<body>
    <div class="admin-container">
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <span>🕌</span>
                <span>Admin</span>
            </div>
            <nav>
                <ul class="admin-menu">
                    <li><a href="/admin">📊 Dashboard</a></li>
                    <li><a href="/admin/articles">📰 Artikel</a></li>
                    <li><a href="/admin/activities">📅 Kegiatan</a></li>
                    <li><a href="/admin/donations">💰 Donasi</a></li>
                    <li><a href="/admin/services">🔧 Layanan</a></li>
                    <li><a href="/admin/gallery" class="active">🖼️ Galeri</a></li>
                    <li><a href="/admin/contacts">📧 Kontak Masuk</a></li>
                    <li><a href="/admin/suggestions">💬 Saran</a></li>
                    <li><a href="/admin/users">👥 Pengguna</a></li>
                    <li><a href="/admin/requests">📋 Pengajuan Sertifikat</a></li>
                    <li><a href="/admin/settings">⚙️ Pengaturan</a></li>
                    <li style="margin-top: 2rem; border-top: 1px solid #374151; padding-top: 1rem;">
                        <a href="/admin/logout">🚪 Logout</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main>
            <header class="admin-header">
                <h1>Kelola Galeri</h1>
                <div class="admin-user">
                    <span id="user-name">Admin</span>
                    <button onclick="logout()">⋮</button>
                </div>
            </header>

            <div class="admin-main">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <div style="display: flex; gap: 1rem;">
                        <button class="btn btn-secondary btn-sm" onclick="filterGallery('all')">Semua</button>
                        <button class="btn btn-secondary btn-sm" onclick="filterGallery('photo')">📸 Foto</button>
                        <button class="btn btn-secondary btn-sm" onclick="filterGallery('video')">▶️ Video</button>
                    </div>
                    <button class="btn btn-primary" onclick="showCreateForm()">➕ Tambah Galeri</button>
                </div>

                <!-- Create/Edit Form (hidden by default) -->
                <div class="card" id="gallery-form-card" style="display: none;">
                    <h2 id="form-title">Tambah Galeri Baru</h2>
                    <form id="gallery-form">
                        <input type="hidden" id="gallery-id">
                        <div class="form-group">
                            <label>Judul</label>
                            <input type="text" id="gallery-title" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Deskripsi</label>
                            <textarea id="gallery-description" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="grid-2" style="gap: 1rem;">
                            <div class="form-group">
                                <label>URL Gambar/Video</label>
                                <input type="text" id="gallery-image-path" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Kategori</label>
                                <select id="gallery-category" class="form-control">
                                    <option value="kegiatan">Kegiatan</option>
                                    <option value="masjid">Masjid</option>
                                    <option value="ramadhan">Ramadhan</option>
                                    <option value="sosial">Sosial</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Tipe</label>
                            <select id="gallery-type" class="form-control">
                                <option value="photo">Foto</option>
                                <option value="video">Video</option>
                            </select>
                        </div>
                        <div style="display: flex; gap: 1rem;">
                            <button type="submit" class="btn btn-primary">Simpan</button>
                            <button type="button" class="btn btn-secondary" onclick="hideForm()">Batal</button>
                        </div>
                    </form>
                </div>

                <!-- Gallery Grid -->
                <div class="card">
                    <div style="overflow-x: auto;">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Preview</th>
                                    <th>Judul</th>
                                    <th>Kategori</th>
                                    <th>Tipe</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="gallery-table-body">
                                <tr><td colspan="6" style="text-align: center; padding: 2rem;">Memuat data...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let allGallery = [];
        let currentFilter = 'all';

        async function loadGallery() {
            try {
                const res = await fetch('/api/admin/gallery');
                const data = await res.json();
                allGallery = data.data || [];
                renderGallery();
            } catch (err) {
                console.error('Failed to load gallery:', err);
            }
        }

        function renderGallery() {
            const tbody = document.getElementById('gallery-table-body');
            let filtered = allGallery;
            if (currentFilter !== 'all') {
                filtered = allGallery.filter(g => g.type === currentFilter);
            }

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem;">Tidak ada data</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map(g => `
                <tr>
                    <td>${g.id}</td>
                    <td>
                        ${g.type === 'photo' ? 
                            `<img src="${g.image_path}" style="width: 80px; height: 60px; object-fit: cover; border-radius: 4px;">` :
                            '▶️'
                        }
                    </td>
                    <td><strong>${g.title}</strong><br><small style="color: var(--gray);">${g.description?.substring(0, 30) || '-'}</small></td>
                    <td>${g.category || '-'}</td>
                    <td><span class="badge ${g.type === 'photo' ? 'badge-primary' : 'badge-secondary'}">${g.type}</span></td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="editGallery(${g.id})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteGallery(${g.id})">Hapus</button>
                    </td>
                </tr>
            `).join('');
        }

        function filterGallery(type) {
            currentFilter = type;
            renderGallery();
        }

        function showCreateForm() {
            document.getElementById('form-title').textContent = 'Tambah Galeri Baru';
            document.getElementById('gallery-id').value = '';
            document.getElementById('gallery-title').value = '';
            document.getElementById('gallery-description').value = '';
            document.getElementById('gallery-image-path').value = '';
            document.getElementById('gallery-category').value = 'kegiatan';
            document.getElementById('gallery-type').value = 'photo';
            document.getElementById('gallery-form-card').style.display = 'block';
        }

        function hideForm() {
            document.getElementById('gallery-form-card').style.display = 'none';
        }

        async function editGallery(id) {
            const item = allGallery.find(g => g.id === id);
            if (!item) return;

            document.getElementById('form-title').textContent = 'Edit Galeri';
            document.getElementById('gallery-id').value = item.id;
            document.getElementById('gallery-title').value = item.title;
            document.getElementById('gallery-description').value = item.description || '';
            document.getElementById('gallery-image-path').value = item.image_path || '';
            document.getElementById('gallery-category').value = item.category || 'kegiatan';
            document.getElementById('gallery-type').value = item.type || 'photo';
            document.getElementById('gallery-form-card').style.display = 'block';
        }

        async function deleteGallery(id) {
            if (!confirm('Yakin ingin menghapus item ini?')) return;
            try {
                const res = await fetch(`/api/admin/gallery/${id}`, { method: 'DELETE' });
                const result = await res.json();
                if (result.status === 'success') {
                    alert('Item dihapus');
                    loadGallery();
                } else {
                    alert('Error: ' + (result.message || 'Gagal'));
                }
            } catch (err) {
                alert('Terjadi kesalahan');
            }
        }

        document.getElementById('gallery-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('gallery-id').value;
            const body = {
                title: document.getElementById('gallery-title').value,
                description: document.getElementById('gallery-description').value,
                image_path: document.getElementById('gallery-image-path').value,
                category: document.getElementById('gallery-category').value,
                type: document.getElementById('gallery-type').value
            };

            let result;
            if (id) {
                result = await fetch(`/api/admin/gallery/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                }).then(r => r.json());
            } else {
                result = await fetch('/api/admin/gallery', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                }).then(r => r.json());
            }

            if (result.status === 'success') {
                alert('Galeri disimpan');
                hideForm();
                loadGallery();
            } else {
                alert('Error: ' + (result.message || 'Gagal'));
            }
        });

        function logout() {
            if (confirm('Apakah Anda yakin ingin logout?')) {
                window.location.href = '/admin/logout';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadGallery();
        });
    </script>
</body>
</html>
